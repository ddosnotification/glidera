<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Glidera — Find your line. Stay in flow.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-1: #0B1840;
  --bg-2: #2F3D7E;
  --bg-3: #56E0BB;
  --accent: #A3F2FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Space Grotesk", -apple-system, system-ui, sans-serif;
  background: #06101e;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.backdrop {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  z-index: 0;
}
.backdrop::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(60% 40% at 50% 100%, rgba(255,255,255,0.18), transparent 70%),
    radial-gradient(80% 50% at 50% 0%, rgba(255,255,255,0.12), transparent 60%);
}
.rays {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 25%, rgba(255,255,255,0.18), transparent 60%);
  z-index: 0;
  pointer-events: none;
}
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 22px 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  text-decoration: none;
  text-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 0 20px rgba(0,0,0,0.15);
}
.nav-logo .vox-mark {
  width: 22px;
  height: 22px;
  position: relative;
  transform: rotate(45deg);
}
.nav-logo .vox-mark::before,
.nav-logo .vox-mark::after {
  content: "";
  position: absolute;
}
.nav-logo .vox-mark::before {
  inset: 0;
  background: linear-gradient(135deg, #fff 0%, #fff 50%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0.7) 100%);
}
.nav-logo .vox-mark::after {
  width: 6px;
  height: 6px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.nav-logo .word {
  font-family: "Bricolage Grotesque", sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.nav-cta {
  display: inline-flex;
  align-items: center;
  background: #fff;
  color: #0B1830;
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  box-shadow: 0 4px 0 rgba(0,0,0,0.18), 0 12px 30px rgba(0,0,0,0.15);
}
.biome {
  position: relative;
  min-height: 100vh;
  padding: 120px 6vw;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 2;
}
.final-cta {
  min-height: 100vh;
  align-items: center;
  text-align: center;
}
.final-cta h2 {
  font-family: "Bricolage Grotesque";
  font-size: clamp(56px, 9vw, 140px);
  font-weight: 800;
  letter-spacing: -0.035em;
  color: #fff;
  line-height: 0.92;
  text-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 24px 80px rgba(0,0,0,0.25);
}
.final-cta p {
  margin-top: 26px;
  font-size: clamp(16px, 1.4vw, 20px);
  color: rgba(255,255,255,0.92);
  max-width: 560px;
  line-height: 1.5;
}
.hero-cta {
  margin-top: 40px;
  display: flex;
  justify-content: center;
}
.btn-store {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 22px;
  background: #0B1830;
  color: #fff;
  text-decoration: none;
  border-radius: 14px;
  font-weight: 600;
  box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 14px 36px rgba(0,0,0,0.25);
}
.btn-store .small {
  font-size: 11px;
  opacity: 0.7;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
}
.btn-store .big {
  font-size: 18px;
  line-height: 1.1;
  font-weight: 700;
}
.pixel-cloud {
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--px));
  grid-template-rows: repeat(var(--rows), var(--px));
}
.pixel-cloud .px { background: #fff; }
.pixel-cloud .px.s { background: #e6f0fa; }
.pixel-cloud .px.x { background: transparent; }
.voxel-scene {
  transform-style: preserve-3d;
  position: relative;
}
.cube {
  position: absolute;
  transform-style: preserve-3d;
}
.face {
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
}
.face.top { transform: rotateX(90deg) translateZ(var(--half)); }
.face.bottom { transform: rotateX(-90deg) translateZ(var(--half)); }
.face.front { transform: translateZ(var(--half)); }
.face.back { transform: rotateY(180deg) translateZ(var(--half)); }
.face.left { transform: rotateY(-90deg) translateZ(var(--half)); }
.face.right { transform: rotateY(90deg) translateZ(var(--half)); }
@keyframes hover {
  0%, 100% { transform: translateY(-12px) rotateZ(-2deg); }
  50% { transform: translateY(14px) rotateZ(2deg); }
}
.parallax { will-change: transform; }
.reveal { opacity: 1; transform: translateY(0); }
@media (max-width: 720px) {
  .nav { padding: 16px 18px; }
}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
/* global React, ReactDOM */

const __hexCache = {};
function shade(hex, amt) {
  const key = hex + "|" + amt;
  if (__hexCache[key]) return __hexCache[key];
  let h = hex.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  const adj = (c) => Math.max(0, Math.min(255, Math.round(c * amt)));
  const out = "#" + [adj(r), adj(g), adj(b)].map(v => v.toString(16).padStart(2, "0")).join("");
  __hexCache[key] = out;
  return out;
}

function Cube({ x = 0, y = 0, z = 0, size = 16, color = "#888" }) {
  const half = size / 2;
  const top = useMemo(() => shade(color, 1.18), [color]);
  const bottom = useMemo(() => shade(color, 0.55), [color]);
  const back = useMemo(() => shade(color, 0.7), [color]);
  const left = useMemo(() => shade(color, 0.8), [color]);
  const right = useMemo(() => shade(color, 0.92), [color]);
  return (
    <div className="cube" style={{ width: size, height: size, transform: `translate3d(${x - half}px, ${y - half}px, ${z - half}px)`, "--half": half + "px" }}>
      <div className="face front" style={{ background: color }}></div>
      <div className="face back" style={{ background: back }}></div>
      <div className="face left" style={{ background: left }}></div>
      <div className="face right" style={{ background: right }}></div>
      <div className="face top" style={{ background: top }}></div>
      <div className="face bottom" style={{ background: bottom }}></div>
    </div>
  );
}

function PixelCloud({ size = 6, variant = 0, style }) {
  const variants = [
    [".XXXX..", "XXXXXX.", "XXXXXXX", ".XXXXX."],
    ["..XX...", ".XXXX..", "XXXXXXX", ".XXXXX."],
    ["...XX..", "..XXXX.", ".XXXXX.", "XXXXXXX", ".XXXXX."],
  ];
  const grid = variants[variant % variants.length];
  const cols = grid[0].length;
  const rows = grid.length;
  return (
    <div className="pixel-cloud" style={{ "--px": size + "px", "--cols": cols, "--rows": rows, ...style }}>
      {grid.flatMap((row, ri) => [...row].map((ch, ci) => (
        <div key={ri + "-" + ci} className={"px " + (ch === "X" ? (ri === 0 ? "s" : "") : "x")} style={ch === "." ? { background: "transparent" } : {}} />
      )))}
    </div>
  );
}

function Nav() {
  return (
    <nav className="nav">
      <a href="#download" className="nav-logo">
        <span className="vox-mark"></span>
        <span className="word">Glidera</span>
      </a>
      <a className="nav-cta" href="privacy.html">Privacy</a>
    </nav>
  );
}

function FinalCTA() {
  return (
    <section className="biome final-cta" id="download">
      <PixelCloud size={6} variant={1} style={{ position: "absolute", top: "12%", left: "10%", opacity: 0.6 }} />
      <PixelCloud size={4} variant={2} style={{ position: "absolute", top: "18%", right: "14%", opacity: 0.5 }} />

      <h2 className="reveal">YOUR<br />SKY IS<br /><span style={{ WebkitTextStroke: "2px #fff", color: "transparent" }}>WAITING.</span></h2>
      <p className="reveal">Free to play. No ads in your line. Two-minute first run.</p>
      <div className="hero-cta reveal">
        <a className="btn-store" href="https://apps.apple.com/us/app/glidera/id6768956024" target="_blank" rel="noopener noreferrer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.5c0-2.85 2.32-4.21 2.43-4.27-1.32-1.94-3.39-2.2-4.12-2.23-1.75-.18-3.42 1.03-4.31 1.03-.91 0-2.27-1.01-3.74-.98-1.92.03-3.71 1.12-4.7 2.83-2.01 3.48-.51 8.62 1.43 11.45.96 1.39 2.09 2.94 3.58 2.89 1.44-.06 1.98-.93 3.72-.93 1.72 0 2.23.93 3.74.9 1.55-.03 2.53-1.4 3.47-2.81 1.1-1.61 1.55-3.18 1.57-3.26-.04-.02-3-1.15-3.07-4.62zM14.5 4.6c.79-.96 1.33-2.29 1.18-3.6-1.14.05-2.52.76-3.34 1.72-.74.85-1.39 2.21-1.21 3.5 1.27.1 2.57-.65 3.37-1.62z"/></svg>
          <div><div className="small">Download on the</div><div className="big">App Store</div></div>
        </a>
      </div>
    </section>
  );
}

function App() {
  return (
    <>
      <div className="backdrop"></div>
      <div className="rays"></div>
      <Nav />
      <FinalCTA />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
