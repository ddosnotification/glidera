<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support · Glidera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --fg:#0b1830; --ink-soft:#5e6e89; --panel:rgba(255,255,255,.92); --panel-border:rgba(255,255,255,.45); --accent:#ffd23f; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; }
    body { font-family:"Space Grotesk",-apple-system,system-ui,sans-serif; color:var(--fg); background:#0b1830; -webkit-font-smoothing:antialiased; }
    a { color:#173258; }

    .sub-root {
      min-height:100vh;
      padding:40px 18px;
      background:
        radial-gradient(80% 60% at 50% 0%, rgba(255,255,255,.16), transparent 65%),
        linear-gradient(180deg,#0ea6ff 0%,#74ccff 60%,#d7f0ff 100%);
    }
    .sub-shell {
      max-width:960px;
      margin:0 auto;
      background:var(--panel);
      border:1px solid var(--panel-border);
      border-radius:22px;
      box-shadow:0 24px 60px rgba(11,24,48,.2);
      padding:clamp(22px,4vw,42px);
    }
    .sub-back {
      display:inline-flex;
      align-items:center;
      text-decoration:none;
      font-weight:700;
      font-size:14px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(11,24,48,.08);
      color:inherit;
    }
    .sub-eyebrow {
      margin-top:22px;
      display:inline-flex;
      align-items:center;
      gap:9px;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(11,24,48,.08);
      font-family:"JetBrains Mono",ui-monospace,monospace;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .sub-eyebrow .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }

    .sub-h1 {
      margin:16px 0 0;
      font-family:"Bricolage Grotesque","Space Grotesk",sans-serif;
      font-size:clamp(44px,9vw,88px);
      line-height:.95;
      letter-spacing:-.03em;
    }
    .sub-meta {
      margin-top:12px;
      font-family:"JetBrains Mono",ui-monospace,monospace;
      font-size:12px;
      letter-spacing:.08em;
      color:var(--ink-soft);
      text-transform:uppercase;
    }
    .sub-sub {
      margin-top:16px;
      max-width:760px;
      font-size:18px;
      line-height:1.6;
      color:#2b3e61;
    }

    .contact-card {
      margin-top:30px;
      background:#f4f7fc;
      border:1px solid #dce6f6;
      border-radius:16px;
      padding:22px;
    }
    .contact-label {
      font-family:"JetBrains Mono",ui-monospace,monospace;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--ink-soft);
    }
    .contact-link {
      display:inline-block;
      margin-top:10px;
      font-family:"Bricolage Grotesque","Space Grotesk",sans-serif;
      font-size:clamp(28px,4.5vw,48px);
      line-height:1;
      letter-spacing:-.02em;
      font-weight:700;
      color:#173258;
      text-decoration-thickness:2px;
      text-underline-offset:6px;
    }

    @media (max-width:700px) {
      .sub-root { padding:16px 12px; }
      .sub-shell { border-radius:16px; }
    }
  </style>
</head>
<body>
  <div class="sub-root">
    <div class="sub-shell">
      <a href="index.html" class="sub-back">← Back to Glidera</a>

      <div class="sub-eyebrow"><span class="dot"></span> Help</div>
      <h1 class="sub-h1">Support</h1>
      <div class="sub-meta">Contact</div>
      <p class="sub-sub">For any issue with the app, reach us directly at:</p>

      <div class="contact-card">
        <div class="contact-label">Email</div>
        <a class="contact-link" href="mailto:frantisekgejdos@gmail.com">frantisekgejdos@gmail.com</a>
      </div>
    </div>
  </div>
</body>
</html>
